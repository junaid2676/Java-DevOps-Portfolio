---
- name: Deploy Portfolio Application Container
  hosts: webservers
  become: no
  tasks:
    - name: Remove existing portfolio container if present
      community.docker.docker_container:
        name: portfolio-app
        state: absent

    - name: Ensure portfolio container is running
      community.docker.docker_container:
        name: portfolio-app
        image: junaid2676/portfolio:latest
        state: started
        restart_policy: always
        published_ports:
          - "8090:8080"
